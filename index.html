<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Nexora — AI Automation & IT Solutions</title>
<meta name="description" content="Nexora builds AI-powered automation systems that capture, qualify, and follow up with your leads — so nothing falls through the cracks." />

<!--
  EDIT GUIDE
  ==========
  1. Company name: search this file for "Nexora" and replace with your real company name.
  2. Contact email: search for "hello@nexora.io" and replace with your Google Workspace address.
  3. Case studies: search for "CASE STUDY" comments below — rewrite once you confirm what's shareable.
  4. Logo: currently a text wordmark (the "N." mark in the nav) — swap for an <img> once you have a logo file.
  5. Booking link: the "Book a Free Automation Audit" buttons currently point to "#contact" (scrolls to the form).
     Replace href="#contact" with your Calendly link once you have one.
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          ink: 'rgb(var(--ink) / <alpha-value>)',
          paper: 'rgb(var(--paper) / <alpha-value>)',
          signal: 'rgb(var(--signal) / <alpha-value>)',
          slate: 'rgb(var(--slate) / <alpha-value>)',
          line: 'rgb(var(--line) / <alpha-value>)',
        },
        fontFamily: {
          display: ['"Space Grotesk"', 'sans-serif'],
          body: ['"Inter"', 'sans-serif'],
        },
      },
    },
  }
</script>
<script>
  try {
    const savedTheme = localStorage.getItem('nexora-theme');
    if (savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
      document.documentElement.classList.add('dark');
    }
  } catch (_) {}
</script>

<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js" crossorigin></script>

<style>
  :root {
    --ink: 18 21 27;
    --paper: 245 244 240;
    --signal: 45 212 191;
    --slate: 139 143 163;
    --line: 34 38 47;
    color-scheme: light;
  }
  .dark {
    --ink: 245 244 240;
    --paper: 18 21 27;
    --signal: 94 234 212;
    --slate: 166 170 188;
    --line: 218 220 228;
    color-scheme: dark;
  }
  html { scroll-behavior: smooth; }
  body { font-family: 'Inter', sans-serif; }
  .font-display { font-family: 'Space Grotesk', sans-serif; }

  @keyframes drawline {
    from { stroke-dashoffset: 1; }
    to { stroke-dashoffset: 0; }
  }
  .pipeline-line {
    stroke-dasharray: 1;
    stroke-dashoffset: 1;
    animation: drawline 1.8s ease forwards;
    animation-delay: 0.3s;
  }
  @keyframes nodepop {
    from { opacity: 0; transform: scale(0.4); }
    to { opacity: 1; transform: scale(1); }
  }
  .pipeline-node {
    opacity: 0;
    animation: nodepop 0.4s ease forwards;
  }
  @media (prefers-reduced-motion: reduce) {
    .pipeline-line, .pipeline-node { animation: none; opacity: 1; stroke-dashoffset: 0; }
  }
</style>
</head>
<body class="bg-paper text-ink">
<div id="root"></div>

<script type="text/babel">
const { useEffect, useState } = React;

function NavBar({ dark, onThemeToggle }) {
  const [open, setOpen] = useState(false);
  const links = [
    { href: '#services', label: 'Services' },
    { href: '#work', label: 'Work' },
    { href: '#about', label: 'About' },
    { href: '#contact', label: 'Contact' },
  ];
  return (
    <header className="sticky top-0 z-50 bg-paper/90 backdrop-blur border-b border-ink/10">
      <div className="max-w-6xl mx-auto px-6 flex items-center justify-between h-16">
        <a href="#top" className="font-display font-700 text-lg tracking-tight">
          Nexora<span className="text-signal">.</span>
        </a>
        <nav className="hidden md:flex items-center gap-8 text-sm text-ink/80">
          {links.map(l => (
            <a key={l.href} href={l.href} className="hover:text-ink transition-colors">{l.label}</a>
          ))}
        </nav>
        <div className="hidden md:flex items-center gap-3">
          <button type="button" onClick={onThemeToggle} aria-label={`Switch to ${dark ? 'light' : 'dark'} mode`} aria-pressed={dark} className="w-9 h-9 inline-flex items-center justify-center border border-ink/20 rounded-sm hover:bg-ink/10 transition-colors">
            {dark ? (
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" aria-hidden="true"><circle cx="12" cy="12" r="4" /><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" /></svg>
            ) : (
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z" /></svg>
            )}
          </button>
          <a href="#contact" className="text-sm font-medium bg-ink text-paper px-4 py-2 rounded-sm hover:bg-ink/85 transition-colors">
            Book a Free Audit
          </a>
        </div>
        <button className="md:hidden" onClick={() => setOpen(!open)} aria-label="Toggle menu">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.8">
            {open ? <path d="M6 6l12 12M18 6L6 18" /> : <path d="M4 7h16M4 12h16M4 17h16" />}
          </svg>
        </button>
      </div>
      {open && (
        <div className="md:hidden border-t border-ink/10 bg-paper px-6 py-4 flex flex-col gap-4 text-sm">
          {links.map(l => (
            <a key={l.href} href={l.href} onClick={() => setOpen(false)}>{l.label}</a>
          ))}
          <button type="button" onClick={onThemeToggle} className="text-left text-ink/70">Switch to {dark ? 'light' : 'dark'} mode</button>
          <a href="#contact" onClick={() => setOpen(false)} className="font-medium text-signal">Book a Free Audit →</a>
        </div>
      )}
    </header>
  );
}

function PipelineDiagram() {
  const nodes = [
    { x: 40, y: 60, label: 'Capture' },
    { x: 180, y: 20, label: 'Score' },
    { x: 320, y: 60, label: 'Follow Up' },
    { x: 460, y: 20, label: 'Close' },
  ];
  return (
    <svg viewBox="0 0 500 120" className="w-full max-w-md" role="img" aria-label="Diagram showing lead flow from Capture to Score to Follow Up to Close">
      <line x1="40" y1="60" x2="180" y2="20" stroke="var(--slate)" strokeWidth="1.5" className="pipeline-line" pathLength="1" />
      <line x1="180" y1="20" x2="320" y2="60" stroke="var(--slate)" strokeWidth="1.5" className="pipeline-line" pathLength="1" style={{animationDelay: '0.7s'}} />
      <line x1="320" y1="60" x2="460" y2="20" stroke="var(--signal)" strokeWidth="1.5" className="pipeline-line" pathLength="1" style={{animationDelay: '1.1s'}} />
      {nodes.map((n, i) => (
        <g key={n.label} className="pipeline-node" style={{animationDelay: `${0.2 + i * 0.4}s`}}>
          <circle cx={n.x} cy={n.y} r="7" fill={i === nodes.length - 1 ? 'var(--signal)' : 'var(--ink)'} />
          <text x={n.x} y={n.y - 16} textAnchor="middle" fontSize="12" fontFamily="Inter" fill="var(--ink)">{n.label}</text>
        </g>
      ))}
    </svg>
  );
}

function Hero() {
  return (
    <section id="top" className="max-w-6xl mx-auto px-6 pt-20 pb-24 grid md:grid-cols-2 gap-12 items-center">
      <div>
        <p className="text-sm text-slate mb-4">IT Solutions for Growing Businesses</p>
        <h1 className="font-display text-4xl md:text-5xl font-600 leading-tight mb-6">
          Stop losing leads and hours to manual work.
        </h1>
        <p className="text-lg text-ink/75 mb-8 max-w-md">
          Nexora builds AI-powered automation systems that capture, qualify, and follow up with your leads — so nothing falls through the cracks and your team focuses on closing, not admin.
        </p>
        <div className="flex flex-wrap items-center gap-6">
          <a href="#contact" className="bg-ink text-paper px-6 py-3 rounded-sm font-medium hover:bg-ink/85 transition-colors">
            Book a Free Automation Audit
          </a>
          <a href="#services" className="text-ink/70 hover:text-ink text-sm underline underline-offset-4">
            See how it works
          </a>
        </div>
      </div>
      <div className="flex justify-center md:justify-end">
        <PipelineDiagram />
      </div>
    </section>
  );
}

function Problem() {
  return (
    <section className="border-t border-line/10 bg-ink text-paper">
      <div className="max-w-6xl mx-auto px-6 py-16">
        <h2 className="font-display text-2xl md:text-3xl font-600 mb-4 max-w-xl">
          Manual follow-up is costing you customers.
        </h2>
        <p className="text-paper/70 max-w-xl">
          Every unanswered lead, every delayed response, every manual data entry step is a chance for a customer to go elsewhere. Most businesses don't have a staffing problem — they have a systems problem.
        </p>
      </div>
    </section>
  );
}

function ServiceRow({ title, status, available, description, items }) {
  return (
    <div className={`grid md:grid-cols-[1fr_2fr] gap-6 py-8 border-t border-ink/10 ${available ? '' : 'opacity-60'}`}>
      <div>
        <h3 className="font-display text-xl font-600 mb-1">{title}</h3>
        <p className={`text-sm ${available ? 'text-signal' : 'text-slate'}`}>{status}</p>
      </div>
      <div>
        <p className="text-ink/75 mb-3 max-w-lg">{description}</p>
        {items && (
          <ul className="text-sm text-ink/65 space-y-1">
            {items.map(it => <li key={it}>— {it}</li>)}
          </ul>
        )}
      </div>
    </div>
  );
}

function Services() {
  return (
    <section id="services" className="max-w-6xl mx-auto px-6 py-20">
      <div className="max-w-xl mb-6">
        <h2 className="font-display text-3xl font-600 mb-3">What We Do</h2>
        <p className="text-ink/70">
          We're an IT solutions company built to grow with you — starting with AI automation, expanding into the infrastructure and web presence you'll need next.
        </p>
      </div>
      <ServiceRow
        title="AI Automation"
        status="Available now"
        available={true}
        description="We design and build automated systems that handle lead capture, scoring, follow-up sequencing, and CRM integration — end to end. If it's a repeatable manual process, we can likely automate it."
        items={['Lead capture & scoring systems', 'Automated follow-up sequences (email / WhatsApp / SMS)', 'CRM & Google Workspace integration', 'Custom chatbots (WhatsApp, web)', 'Document & data processing automation']}
      />
      <ServiceRow
        title="Cloud Computing"
        status="Coming soon"
        available={false}
        description="Infrastructure setup, migration, and management to keep your systems reliable and scalable as you grow."
      />
      <ServiceRow
        title="Web Design"
        status="Coming soon"
        available={false}
        description="Clean, fast, conversion-focused websites — built to work seamlessly with the automation systems we design."
      />
    </section>
  );
}

function Process() {
  const steps = [
    { n: '01', title: 'Audit', body: "We map your current workflow on a free 30-minute call and identify exactly where automation saves you the most time and money." },
    { n: '02', title: 'Build', body: 'We design and build your custom automation system, testing each component before it touches your live operations.' },
    { n: '03', title: 'Launch & Support', body: 'We deploy, train you or your team on it, and stay on to monitor and refine as your business changes.' },
  ];
  return (
    <section className="border-t border-ink/10">
      <div className="max-w-6xl mx-auto px-6 py-20">
        <h2 className="font-display text-3xl font-600 mb-10">How We Work</h2>
        <div className="grid md:grid-cols-3 gap-10">
          {steps.map(s => (
            <div key={s.n}>
              <p className="font-display text-signal text-sm mb-2">{s.n}</p>
              <h3 className="font-display text-lg font-600 mb-2">{s.title}</h3>
              <p className="text-ink/70 text-sm leading-relaxed">{s.body}</p>
            </div>
          ))}
        </div>
      </div>
    </section>
  );
}

function CaseStudy({ title, problem, solution, result }) {
  return (
    <div className="border-t border-ink/10 py-10 grid md:grid-cols-[1fr_2fr] gap-6">
      <h3 className="font-display text-lg font-600">{title}</h3>
      <div className="space-y-3 text-sm text-ink/75 max-w-2xl">
        <p><span className="text-ink font-medium">The problem: </span>{problem}</p>
        <p><span className="text-ink font-medium">The solution: </span>{solution}</p>
        <p><span className="text-ink font-medium">The result: </span>{result}</p>
      </div>
    </div>
  );
}

function Work() {
  return (
    <section id="work" className="max-w-6xl mx-auto px-6 py-20">
      <h2 className="font-display text-3xl font-600 mb-2">Real Systems, Real Results</h2>
      <p className="text-ink/60 mb-4 max-w-xl">A few of the systems we've built. More case studies coming as we take on new clients.</p>

      {/* CASE STUDY 1 — rewrite with real client details once confirmed shareable */}
      <CaseStudy
        title="Lead Capture & Sales Follow-Up System"
        problem="A growing IT solutions business had no structured way to capture, score, or follow up with inbound leads — inquiries were tracked manually and often went cold before a reply went out."
        solution="Built an end-to-end automation pipeline: leads submitted via form are automatically scored, assigned a sequential ID, logged into a CRM, and routed into a follow-up sequence — with zero manual data entry."
        result="Leads are now captured, scored, and followed up with automatically within minutes of submission — eliminating lost inquiries and manual tracking work entirely."
      />
      {/* CASE STUDY 2 */}
      <CaseStudy
        title="WhatsApp Customer Automation"
        problem="A business needed to handle incoming customer messages on WhatsApp without hiring a dedicated support team."
        solution="Built a WhatsApp-based automation system using the Meta Cloud API to handle incoming messages, send structured template responses, and route conversations automatically."
        result="Customer messages are now answered instantly, 24/7, without manual intervention."
      />
      {/* CASE STUDY 3 */}
      <CaseStudy
        title="AI-Powered Candidate Screening"
        problem="Manually reviewing every incoming CV/resume was slow and inconsistent."
        solution="Built an automated pipeline that pulls submitted resumes, analyzes them with AI against defined criteria, and outputs structured, comparable candidate summaries."
        result="Screening time cut dramatically, with consistent, structured output for every candidate."
      />
    </section>
  );
}

function About() {
  return (
    <section id="about" className="border-t border-ink/10 bg-ink text-paper">
      <div className="max-w-6xl mx-auto px-6 py-20 grid md:grid-cols-[1fr_2fr] gap-8">
        <h2 className="font-display text-3xl font-600">Why Nexora</h2>
        <div className="space-y-4 text-paper/75 max-w-xl">
          <p>
            Nexora was founded to help businesses — wherever they are in the world — stop losing time and revenue to manual work. We started with AI automation because it delivers the fastest, most measurable impact, and we're building toward full-spectrum IT solutions: cloud infrastructure and web design included.
          </p>
          <p>
            We work hands-on with every client, building and testing systems incrementally so what you get is reliable, not just impressive in a demo.
          </p>
          <p className="text-signal text-sm">Based in Kampala, Uganda — built for clients anywhere.</p>
        </div>
      </div>
    </section>
  );
}

function Contact() {
  const [form, setForm] = useState({ name: '', email: '', company: '', need: '' });
  const [submitted, setSubmitted] = useState(false);

  const handleChange = (e) => setForm({ ...form, [e.target.name]: e.target.value });
  const handleSubmit = (e) => {
    e.preventDefault();
    // No backend wired yet — this just confirms the form works.
    // Once you have a form service (e.g. Tally, Formspree) or your own endpoint,
    // send `form` there inside this function.
    setSubmitted(true);
  };

  return (
    <section id="contact" className="max-w-6xl mx-auto px-6 py-20">
      <div className="max-w-xl mb-10">
        <h2 className="font-display text-3xl font-600 mb-3">Let's Find What You Can Automate</h2>
        <p className="text-ink/70">
          Book a free 30-minute audit call. We'll look at your current workflow and tell you exactly where automation would save you the most time — no obligation.
        </p>
      </div>

      {submitted ? (
        <div className="border border-signal/40 bg-signal/10 text-ink px-6 py-8 max-w-lg rounded-sm">
          <p className="font-medium mb-1">Thanks — that's in.</p>
          <p className="text-sm text-ink/70">We'll get back to you shortly. In the meantime feel free to email hello@nexora.io directly.</p>
        </div>
      ) : (
        <form onSubmit={handleSubmit} className="max-w-lg space-y-5">
          <div>
            <label className="block text-sm mb-1" htmlFor="name">Name</label>
            <input required id="name" name="name" value={form.name} onChange={handleChange}
              className="w-full border border-ink/20 bg-transparent px-3 py-2 rounded-sm focus:outline-none focus:ring-2 focus:ring-signal" />
          </div>
          <div>
            <label className="block text-sm mb-1" htmlFor="email">Email</label>
            <input required type="email" id="email" name="email" value={form.email} onChange={handleChange}
              className="w-full border border-ink/20 bg-transparent px-3 py-2 rounded-sm focus:outline-none focus:ring-2 focus:ring-signal" />
          </div>
          <div>
            <label className="block text-sm mb-1" htmlFor="company">Company</label>
            <input id="company" name="company" value={form.company} onChange={handleChange}
              className="w-full border border-ink/20 bg-transparent px-3 py-2 rounded-sm focus:outline-none focus:ring-2 focus:ring-signal" />
          </div>
          <div>
            <label className="block text-sm mb-1" htmlFor="need">What are you looking to automate?</label>
            <textarea id="need" name="need" rows="3" value={form.need} onChange={handleChange}
              className="w-full border border-ink/20 bg-transparent px-3 py-2 rounded-sm focus:outline-none focus:ring-2 focus:ring-signal" />
          </div>
          <button type="submit" className="bg-ink text-paper px-6 py-3 rounded-sm font-medium hover:bg-ink/85 transition-colors">
            Book My Free Audit
          </button>
          <p className="text-sm text-ink/60 pt-1">
            Prefer email? Reach us directly at <a className="underline" href="mailto:hello@nexora.io">hello@nexora.io</a>
          </p>
        </form>
      )}
    </section>
  );
}

function Footer() {
  return (
    <footer className="border-t border-ink/10">
      <div className="max-w-6xl mx-auto px-6 py-10 flex flex-col md:flex-row justify-between gap-4 text-sm text-ink/60">
        <div>
          <p className="font-display text-ink font-600">Nexora</p>
          <p>AI Automation & IT Solutions</p>
        </div>
        <div className="flex gap-6">
          <a href="#services" className="hover:text-ink">Services</a>
          <a href="#work" className="hover:text-ink">Work</a>
          <a href="#about" className="hover:text-ink">About</a>
          <a href="#contact" className="hover:text-ink">Contact</a>
        </div>
        <p>© 2026 Nexora. All rights reserved.</p>
      </div>
    </footer>
  );
}

function App() {
  const [dark, setDark] = useState(() => document.documentElement.classList.contains('dark'));

  useEffect(() => {
    document.documentElement.classList.toggle('dark', dark);
    try {
      localStorage.setItem('nexora-theme', dark ? 'dark' : 'light');
    } catch (_) {}
  }, [dark]);

  return (
    <div className="font-body">
      <NavBar dark={dark} onThemeToggle={() => setDark(!dark)} />
      <Hero />
      <Problem />
      <Services />
      <Process />
      <Work />
      <About />
      <Contact />
      <Footer />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
